name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracostume
          POSTGRES_PASSWORD: tracostume
          POSTGRES_DB: tracostume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracostume -d tracostume"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tracostume:tracostume@localhost:5432/tracostume
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compile translations
        run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - name: Lint
        run: |
          if ! npm run lint; then
            echo '::group::Formatting diff (prettier --write)'
            npx prettier --write . > /dev/null && git diff
            echo '::endgroup::'
            exit 1
          fi
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Apply migrations and seed
        run: npm run db:deploy && npm run db:seed
      - name: Build
        run: npm run build
      - name: Smoke test with screenshots
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          # The dev server: the production build assumes HTTPS (secure cookies, origin check).
          npx vite dev --port 5173 --strictPort > server.log 2>&1 &
          npx --yes wait-on -t 120000 http-get://localhost:5173/login
          node scripts/smoke.mjs http://localhost:5173 screenshots
      - name: Server log
        if: always()
        run: cat server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
